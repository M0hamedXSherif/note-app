<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Notes | Mohamed Sherif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080d;--sf:#0e1018;--sf2:#141725;--bd:#1d2130;--tx:#e8ecf6;--mu:#8a92a8;--a1:#22d3ee;--a2:#a78bfa;--rd:#f87171;
--fs:'Cairo',system-ui,'Segoe UI',Tahoma,sans-serif;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--fs);line-height:1.65;min-height:100vh;overflow-x:hidden;
padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.orb{position:fixed;border-radius:50%;filter:blur(110px);opacity:.22;pointer-events:none;z-index:0}
.o1{width:420px;height:420px;background:var(--a1);top:-120px;left:-100px}
.o2{width:380px;height:380px;background:var(--a2);bottom:-120px;right:-100px}
.app{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:24px 20px 64px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
 
/* Top bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.av{position:relative;width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,var(--a1),var(--a2));color:#07080d;font-weight:700;overflow:hidden;box-shadow:0 0 18px -4px var(--a1)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.who{margin-inline-end:auto;line-height:1.3}.who b{display:block;font-size:17px}.who span{color:var(--mu);font-size:13px}
.back{color:var(--mu);text-decoration:none;font-size:14px;border:1px solid var(--bd);border-radius:10px;padding:6px 14px;transition:border-color .2s,color .2s}
.back:hover{color:var(--a1);border-color:var(--a1)}
 
h1{font-size:clamp(30px,5.5vw,52px);line-height:1.2;margin:48px 0 8px;font-weight:700}
.lead{color:var(--mu);margin:0 0 28px;max-width:52ch;font-size:17px}
 
/* Composer: the one memorable element */
.gb{position:relative;padding:2px;border-radius:20px;overflow:hidden}
.gb::before{content:"";position:absolute;left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;background:conic-gradient(from 0deg,transparent 0 55%,var(--a1),var(--a2),transparent 90%);animation:spin 6s linear infinite}
.gb:focus-within::before{animation-duration:2.2s}
@keyframes spin{to{transform:rotate(360deg)}}
.cmp{position:relative;background:var(--sf);border-radius:18px;padding:16px 18px 14px;display:grid;gap:6px}
.cmp input,.cmp textarea{width:100%;background:transparent;border:0;outline:0;resize:vertical;color:var(--tx)}
.cmp input{font-size:19px;font-weight:600;padding:4px 0}
.cmp textarea{font-size:16px;min-height:84px;padding:4px 0;line-height:1.7}
::placeholder{color:#5d657b}
.crow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--bd);padding-top:12px;margin-top:6px}
.hint{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-inline-end:auto;min-height:28px;color:var(--mu);font-size:13px}
.add{border:0;border-radius:12px;padding:9px 22px;font-weight:700;cursor:pointer;color:#07080d;background:linear-gradient(90deg,var(--a1),var(--a2));transition:box-shadow .2s,transform .15s}
.add:hover{box-shadow:0 0 26px -6px var(--a1)}.add:active{transform:scale(.97)}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
 
.tag{display:inline-block;font-size:12px;padding:1px 10px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);background:var(--sf2)}
.tag.new{border-color:color-mix(in srgb,var(--a1) 50%,transparent);color:var(--a1);animation:pop .3s}
@keyframes pop{from{transform:scale(.7);opacity:0}}
 
/* Toolbar */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:40px 0 20px}
.bar>input{flex:1 1 220px;min-width:0;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:9px 14px;outline:0}
.bar>input:focus{border-color:var(--a1)}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 100%;order:3}
.chip{cursor:pointer;background:transparent;border:1px solid var(--bd);border-radius:99px;padding:2px 14px;font-size:13px;color:var(--mu)}
.chip[aria-pressed="true"]{color:#07080d;background:var(--a1);border-color:var(--a1)}
.gh{cursor:pointer;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:8px 14px;font-size:14px;color:var(--mu)}
.gh:hover{color:var(--a1);border-color:var(--a1)}
.stats{color:var(--mu);font-size:13px;margin-inline-start:auto}
 
/* Notes */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.note{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:16px 16px 12px;display:flex;flex-direction:column;gap:8px;position:relative}
.note.pin{border-color:color-mix(in srgb,var(--a2) 60%,transparent);box-shadow:0 0 28px -14px var(--a2)}
.note.fresh{animation:pop .4s}
.note h3{margin:0;font-size:18px;line-height:1.35;word-break:break-word}
.note p{margin:0;color:#b9c0d4;white-space:pre-wrap;word-break:break-word;font-size:15px}
.note [contenteditable="true"]{outline:1px dashed var(--a1);outline-offset:4px;border-radius:4px}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.foot{display:flex;align-items:center;gap:4px;margin-top:auto;padding-top:8px;color:var(--mu);font-size:12px}
.foot span{margin-inline-end:auto}
.ic{background:transparent;border:0;cursor:pointer;color:var(--mu);padding:4px 8px;border-radius:8px;font-size:13px}
.ic:hover{color:var(--tx);background:var(--sf2)}.ic.del:hover{color:var(--rd)}
.ic[aria-pressed="true"]{color:var(--a2)}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:56px 12px;border:1px dashed var(--bd);border-radius:16px}
.empty b{display:block;color:var(--tx);font-size:18px;margin-bottom:4px}
 
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;pointer-events:none;background:var(--sf2);border:1px solid var(--bd);border-radius:14px;padding:10px 12px 10px 18px;display:flex;align-items:center;gap:14px;transition:.3s;z-index:5;box-shadow:0 14px 40px -12px #000}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:transparent;border:0;color:var(--a1);font-weight:700;cursor:pointer;padding:4px 8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>
<div class="app">
 
<div class="top">
  <div class="av"><span>MS</span><img src="assets/profile-pic.png" alt="Mohamed Sherif" onerror="this.remove()"></div>
  <div class="who"><b>Mohamed Sherif</b><span>Smart Notes</span></div>
  <a class="back" href="https://m0hamedxsherif.github.io/My-portfolio/">Back to portfolio</a>
</div>
 
<h1>Write it down. Find it later.</h1>
<p class="lead">Notes that tag themselves as you type, stay on your device, and work in English and Arabic.</p>
 
<div class="gb"><div class="cmp">
  <input id="t" placeholder="Title (optional, I’ll suggest one)" dir="auto" maxlength="80">
  <textarea id="x" placeholder="What’s on your mind?" dir="auto"></textarea>
  <div class="crow">
    <div class="hint" id="hint">Smart tags appear here as you write</div>
    <button class="add" id="add">Save note</button>
  </div>
</div></div>
 
<div class="bar">
  <input id="q" type="search" placeholder="Search notes" dir="auto" aria-label="Search notes">
  <button class="gh" id="ex">Export</button>
  <label class="gh" tabindex="0">Import<input id="im" type="file" accept="application/json" hidden></label>
  <div class="stats" id="stats"></div>
  <div class="chips" id="chips"></div>
</div>
 
<div class="grid" id="grid"></div>
</div>
 
<div id="toast" role="status"><span id="tm"></span><button id="ub">Undo</button></div>
 
<script>
var $=function(s){return document.querySelector(s)};
var KEY="smart_notes_v2",notes=[],filter="all",undo=null,toastT;
 
/* Smart tags: keyword lists (English + Arabic). Add your own words here. */
var KW={
  work:["meeting","project","client","deadline","email","task","اجتماع","مشروع","عميل","شغل","مهمة"],
  study:["study","exam","lecture","course","homework","assignment","مذاكرة","امتحان","محاضرة","كورس","دراسة","واجب"],
  ideas:["idea","what if","maybe","concept","فكرة","ممكن نعمل","تصور"],
  code:["bug","function","api","git","css","html","javascript","react","code","كود","برمجة","باج"],
  todo:["todo","remember","tomorrow","don’t forget","dont forget","reminder","لازم","افتكر","بكرة","غدا","تذكير"],
  shopping:["buy","shopping","groceries","اشتري","شراء","أشتري"]
};
function detect(s){s=s.toLowerCase();return Object.keys(KW).filter(function(k){return KW[k].some(function(w){return s.indexOf(w)>-1})}).slice(0,3)}
function autoTitle(t){var l=t.trim().split("\n")[0];return l.length>38?l.slice(0,36).trim()+"…":l}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function mk(title,text){return{id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:title||autoTitle(text),text:text,tags:detect(title+" "+text),pin:false,ts:Date.now()}}
 
function load(){
  try{var d=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(d))return d}catch(e){}
  try{var o=JSON.parse(localStorage.getItem("notes"));if(Array.isArray(o))return o.map(function(t){return mk("",String(t))})}catch(e){}
  return[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(notes))}catch(e){}}
 
function render(freshId){
  var q=$("#q").value.trim().toLowerCase(),all={};
  notes.forEach(function(n){n.tags.forEach(function(t){all[t]=1})});
  var cs=["all"].concat(Object.keys(all));if(cs.indexOf(filter)<0)filter="all";
  $("#chips").innerHTML=cs.length<2?"":cs.map(function(c){return'<button class="chip" data-c="'+c+'" aria-pressed="'+(c===filter)+'">'+(c==="all"?"All":c)+'</button>'}).join("");
  var list=notes.filter(function(n){
    return(filter==="all"||n.tags.indexOf(filter)>-1)&&(!q||(n.title+" "+n.text+" "+n.tags.join(" ")).toLowerCase().indexOf(q)>-1)
  }).sort(function(a,b){return(b.pin-a.pin)||(b.ts-a.ts)});
  $("#grid").innerHTML=list.length?list.map(function(n){
    return'<article class="note'+(n.pin?' pin':'')+(n.id===freshId?' fresh':'')+'" data-id="'+n.id+'">'
    +'<h3 class="tt" dir="auto">'+esc(n.title)+'</h3>'
    +(n.tags.length?'<div class="meta">'+n.tags.map(function(t){return'<span class="tag">'+t+'</span>'}).join("")+'</div>':'')
    +'<p class="bd" dir="auto">'+esc(n.text)+'</p>'
    +'<div class="foot"><span>'+new Date(n.ts).toLocaleDateString(undefined,{month:"short",day:"numeric"})+'</span>'
    +'<button class="ic" data-a="pin" aria-pressed="'+n.pin+'" aria-label="Pin note">Pin</button>'
    +'<button class="ic" data-a="edit">Edit</button>'
    +'<button class="ic del" data-a="del">Delete</button></div></article>'
  }).join(""):'<div class="empty"><b>'+(notes.length?'No notes match':'No notes yet')+'</b>'+(notes.length?'Try a different search or tag.':'Write your first note above and it will appear here.')+'</div>';
  var w=notes.reduce(function(s,n){return s+(n.text.trim()?n.text.trim().split(/\s+/).length:0)},0);
  $("#stats").textContent=notes.length+" notes · "+w+" words";
}
 
/* Live smart-tag hint while typing */
function hint(){
  var t=detect($("#t").value+" "+$("#x").value);
  $("#hint").innerHTML=t.length?'Suggested tags: '+t.map(function(x){return'<span class="tag new">'+x+'</span>'}).join(" "):"Smart tags appear here as you write";
}
$("#t").addEventListener("input",hint);$("#x").addEventListener("input",hint);
 
function add(){
  var t=$("#t").value.trim(),x=$("#x").value.trim();
  if(!x){var b=$(".gb");b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");$("#x").focus();return}
  var n=mk(t,x);notes.push(n);save();render(n.id);
  $("#t").value="";$("#x").value="";hint();$("#x").focus();
}
$("#add").onclick=add;
$("#x").addEventListener("keydown",function(e){if((e.ctrlKey||e.metaKey)&&e.key==="Enter")add()});
$("#q").addEventListener("input",function(){render()});
$("#chips").onclick=function(e){var c=e.target.closest("[data-c]");if(c){filter=c.dataset.c;render()}};
 
/* Toast with undo */
function toast(msg,fn){
  $("#tm").textContent=msg;undo=fn||null;$("#ub").style.display=fn?"":"none";
  $("#toast").classList.add("on");clearTimeout(toastT);toastT=setTimeout(function(){$("#toast").classList.remove("on");undo=null},5000)}
$("#ub").onclick=function(){if(undo)undo();$("#toast").classList.remove("on");undo=null};
 
/* Pin, edit, delete (event delegation) */
$("#grid").onclick=function(e){
  var btn=e.target.closest("[data-a]");if(!btn)return;
  var card=btn.closest(".note"),id=card.dataset.id,n=notes.filter(function(x){return x.id===id})[0];if(!n)return;
  var a=btn.dataset.a;
  if(a==="pin"){n.pin=!n.pin;save();render()}
  else if(a==="del"){
    var i=notes.indexOf(n);notes.splice(i,1);save();render();
    toast("Note deleted",function(){notes.splice(i,0,n);save();render()})
  }else if(a==="edit"){
    var tt=card.querySelector(".tt"),bd=card.querySelector(".bd");
    if(btn.textContent==="Edit"){
      tt.contentEditable=bd.contentEditable="true";btn.textContent="Save";bd.focus()
    }else{
      var nt=tt.innerText.trim(),nx=bd.innerText.trim();
      if(!nx){toast("A note can’t be empty");return}
      n.title=nt||autoTitle(nx);n.text=nx;n.tags=detect(n.title+" "+nx);save();render();toast("Changes saved")
    }
  }
};
 
/* Export / import */
$("#ex").onclick=function(){
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(notes,null,2)],{type:"application/json"}));
  a.download="smart-notes.json";a.click();URL.revokeObjectURL(a.href)};
$("#im").onchange=function(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){
    try{var d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;
      var have={};notes.forEach(function(n){have[n.id]=1});var c=0;
      d.forEach(function(n){if(n&&n.text&&!have[n.id]){notes.push({id:n.id||mk("","").id,title:n.title||autoTitle(n.text),text:String(n.text),tags:Array.isArray(n.tags)?n.tags:detect(n.text),pin:!!n.pin,ts:n.ts||Date.now()});c++}});
      save();render();toast(c+" notes imported")
    }catch(err){toast("That file isn’t a valid notes export")}};
  r.readAsText(f);e.target.value=""};
 
notes=load();save();render();hint();
</script>
</body>
</html>
